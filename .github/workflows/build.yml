name: Build PSP Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Upload EBOOT
        uses: actions/upload-artifact@v4
        with:
          name: Nikitu-PSP
          path: EBOOT.PBP
